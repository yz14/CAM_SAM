# Swin-T (torchvision) + GradCAM
# 说明：torchvision swin_t 的 features[-2] 是最终 LayerNorm，输出 (B,7,7,C) (NHWC)。
# core.target_layers.swin_reshape_transform 的实现兼容两种来源：
#   - timm 风格 (B, 49, C)            -> reshape -> permute
#   - torchvision 风格 (B, 7, 7, C)   -> reshape (no-op) -> permute
# 因此这里直接配置即可。
#
# 想完全不用 reshape_transform？把 target_layer 改成 "features.-1"（Permute 层，已是 NCHW），
# 并把 reshape_transform 设为 null。两条路等价。

device: cuda

model:
  source: torchvision
  name: swin_t
  num_classes: 1000
  pretrained: false           # true + 有网络则下载 ImageNet 权重
  weights_path: null
  weights_strict: true
  target_layer: "features.-2" # 最后的 LayerNorm（NHWC）
  reshape_transform:
    kind: swin
    height: 7
    width: 7

input:
  image: D:/codes/data/Gastrovision/Colon diverticula/3.jpg
  image_size: 224
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]

cam:
  method: gradcam
  target_class: null
  aug_smooth: false
  eigen_smooth: false
  extra: {}

output:
  path: outputs/swin_gradcam.png
