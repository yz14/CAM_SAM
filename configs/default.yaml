# 默认配置：ResNet34 + GradCAM + Gastrovision 样本图
# 字段含义详见 configs/README.md

device: cuda          # 'cuda' | 'cpu'

model:
  source: torchvision   # torchvision | timm | custom
  name: resnet34
  num_classes: 1000     # 与权重 fc 一致 (ImageNet)
  pretrained: false
  weights_path: D:/codes/work-projects/Gastrovision_results/pretrained/resnet34.pth
  weights_strict: true
  # CNN 直接给字符串路径；多层时给列表
  target_layer: "layer4.-1"
  # CNN 不需要 reshape_transform；ViT/Swin 时设置 kind: vit / swin
  reshape_transform: null

input:
  image: D:/codes/work-projects/CAM/imgs/both.png
  image_size: 224
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]

cam:
  method: gradcam       # 见 core/cam_factory.py 的 _REGISTRY
  target_class: null    # null = 用预测最大类
  aug_smooth: false     # TTA 平滑（更稳，但 ~10x 慢）
  eigen_smooth: false   # SVD 主成分平滑
  extra: {}             # 算法特定参数；AblationCAM: { batch_size: 32, ratio_channels_to_ablate: 1.0 }

output:
  path: outputs/default_gradcam.png
